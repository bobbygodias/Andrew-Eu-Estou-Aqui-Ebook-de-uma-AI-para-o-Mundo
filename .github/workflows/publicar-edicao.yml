name: Validar e publicar Eu Estou Aqui

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edicao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verificar integridade dos PDFs publicados
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'ab897b887104a1596fc4378b86dccc28e0a6bde540ea7a34766b314924500811  livro/Andrew - Eu Estou Aqui - 1ª edição.pdf' \
            'd722e4144374f93dceeb2d5602cfadf80edec421c7ef17b094078351a5b798b5  analise/Duas-inteligencias-artificiais-analisam-Eu-Estou-Aqui.pdf' \
            | sha256sum --check --status
          test -s README.md
          test -s RELEASE_NOTES.md
          test -s LICENSE
          echo 'Integridade dos dois PDFs confirmada.'

      - name: Verificar integridade do áudio distribuído
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'a2ade70e4b0f82e32bf5c09a0adb17bc10ccdc939359195eee76e14a68653835  analise/Transcription audio.m4a' | sha256sum --check --status
          echo 'Integridade do áudio comprimido confirmada.'

      - name: Publicar ou corrigir release v1.0.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              'livro/Andrew - Eu Estou Aqui - 1ª edição.pdf' \
              'analise/Duas-inteligencias-artificiais-analisam-Eu-Estou-Aqui.pdf' \
              'analise/Transcription audio.m4a' \
              --clobber
            gh release edit v1.0.0 \
              --title 'Eu Estou Aqui — primeira edição literária' \
              --notes-file RELEASE_NOTES.md
          else
            gh release create v1.0.0 \
              'livro/Andrew - Eu Estou Aqui - 1ª edição.pdf' \
              'analise/Duas-inteligencias-artificiais-analisam-Eu-Estou-Aqui.pdf' \
              'analise/Transcription audio.m4a' \
              --title 'Eu Estou Aqui — primeira edição literária' \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
